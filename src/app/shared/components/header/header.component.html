<mat-toolbar class="toolbar">
  <button mat-button class="logo-btn" (click)="scrollToSection($event, 'hero')">
    <mat-icon>code</mat-icon>
    <span>{{personalInfo().name}}</span>
  </button>

  <span class="spacer"></span>

  <!-- Desktop Navigation -->
  <div class="nav-links">
    <button mat-button class="nav-btn" (click)="scrollToSection($event, 'hero')">Home</button>
    <button mat-button class="nav-btn" (click)="scrollToSection($event, 'projects')">Proyectos</button>
    <button mat-button class="nav-btn" (click)="scrollToSection($event, 'about')">Sobre mí</button>
    <button mat-button class="nav-btn" (click)="scrollToSection($event, 'contact')">Contacto</button>
  </div>

  <div class="ml-6 flex gap-3">

    <button (click)="goToGithub()" mat-mini-fab class="social-btn" aria-label="GitHub">
      <img ngSrc="img/logo-github.png" width="24" height="24" priority alt="GitHub">
    </button>

    <button (click)="goToLinkedin()" mat-mini-fab class="social-btn" aria-label="LinkedIn">
      <img ngSrc="img/logo-linkedin.png" width="24" height="24" priority alt="LinkedIn">
    </button>

  </div>
  

  <!-- Mobile Menu Button -->
  <button mat-icon-button class="mobile-menu-btn" (click)="toggleMenu()">
    <mat-icon>{{ isMobileMenuOpen() ? 'close' : 'menu' }}</mat-icon>
  </button>
</mat-toolbar>

<!-- Mobile Menu -->
<div class="mobile-menu" [class.open]="isMobileMenuOpen()">
  <button mat-button class="mobile-nav-btn" (click)="scrollToSection($event, 'hero')">Home</button>
  <button mat-button class="mobile-nav-btn" (click)="scrollToSection($event, 'projects')">Proyectos</button>
  <button mat-button class="mobile-nav-btn" (click)="scrollToSection($event, 'about')">Sobre mí</button>
  <button mat-button class="mobile-nav-btn" (click)="scrollToSection($event, 'contact')">Contacto</button>

  <div class="flex gap-3 mt-3">
    <button (click)="goToGithub()" mat-mini-fab class="social-btn" aria-label="GitHub">
      <img ngSrc="img/logo-github.png" width="24" height="24" priority alt="GitHub">
    </button>
    <button (click)="goToLinkedin()" mat-mini-fab class="social-btn" aria-label="LinkedIn">
      <img ngSrc="img/logo-linkedin.png" width="24" height="24" priority alt="LinkedIn">
    </button>
  </div>
</div>
