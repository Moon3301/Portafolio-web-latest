<div class="project-detail">
    <div class="project-detail-title" style="width: 100%;">
        <h1 style="font-size: 40px; margin: 0 auto;">{{hero?.name}}</h1>
        <span style="color: grey; text-align: center; margin-bottom: 3rem;">
            {{hero?.description}}
        </span>
    </div>

    <mat-card class="project-detail-card">
        <img mat-card-image width="100%" height="100%" [src]="hero?.image" class="project-detail-image" alt="Project Image">
    </mat-card>

</div>
